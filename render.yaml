# Render Blueprint: free static site, no build step. Dashboard → New → Blueprint → pick this repo → Apply.
services:
  - type: web
    name: reedhguide
    runtime: static
    buildCommand: echo "static site, nothing to build"
    staticPublishPath: .
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
